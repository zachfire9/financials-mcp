# Cargo.toml is the package manifest: the project's name, version, Rust
# edition, and (from Step 02 on) its dependencies. `cargo build`, `cargo run`
# and `cargo test` all read it.
[package]
name = "financials-mcp"
version = "0.1.0"
edition = "2024"
# The oldest Rust that can build this crate. The MCP SDK (rmcp) needs 1.88.
rust-version = "1.88"
description = "MCP server that lets AI agents run retirement projections through financials-api"
repository = "https://github.com/zachfire9/financials-mcp"
# This is an application, not a library for crates.io; this prevents an
# accidental `cargo publish`.
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"], optional = true }
clap = { version = "4.6.8", features = ["derive"] }
lambda_http = { version = "1.3.2", default-features = false, features = ["apigw_http"], optional = true }
reqwest = "0.13.5"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
rmcp = { version = "3.11.0", features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
# `test-util` adds paused time (`tokio::time::pause`), for time-limit tests.
tokio = { version = "1.54.1", features = ["test-util"] }
wiremock = "0.6.5"

# Optional parts of the program, chosen at build time. `cargo build` uses the
# defaults; `cargo build --no-default-features` leaves them out.
[features]
default = ["http"]
# `serve --http`: MCP over Streamable HTTP (Step 19). Turns on the axum
# dependency and rmcp's HTTP server transport.
http = ["dep:axum", "rmcp/transport-streamable-http-server", "tokio/net", "tokio/signal"]
# The AWS Lambda binary (Step 21): the HTTP server, driven by Lambda events
# instead of a listening socket. Off by default: only the Lambda build needs
# `lambda_http` and its dependencies.
lambda = ["http", "dep:lambda_http"]

# A second executable, `lambda`, next to the main `financials-mcp` one.
# `required-features` means plain `cargo build` skips it; build it with
# `cargo build --features lambda --bin lambda` (or cargo-lambda, below).
[[bin]]
name = "lambda"
path = "src/bin/lambda.rs"
required-features = ["lambda"]

# Settings for `--release` builds (the Lambda binary and `cargo build
# --release`). Smaller, faster binaries in exchange for slower builds: a
# smaller binary means a faster Lambda cold start.
[profile.release]
# Link-time optimization: optimize across crates, not just within each one.
lto = true
# One unit per crate, so the optimizer sees all of it at once.
codegen-units = 1
# Drop debug symbols from the binary.
strip = true
# Not `panic = "abort"`: batch tools rely on a panicking task being caught
# (`JoinSet` reports it as an error row) rather than ending the process.
