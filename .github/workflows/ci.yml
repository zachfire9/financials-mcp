name: CI

on:
  push:
    branches: ['**']
  pull_request:
  # Weekly, so a newly published advisory for a dependency fails CI even when
  # nothing in the repo changed.
  schedule:
    - cron: '23 14 * * 1'
  # The deploy workflow runs this whole file first and deploys the Lambda zip
  # it builds, so what's deployed is exactly what was tested and checked.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub-hosted runners ship rustup, so no third-party action is needed.
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # The same without optional features (no HTTP transport), so the
      # smaller build keeps compiling and passing.
      - run: cargo clippy --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --locked --no-default-features
      # And with every feature, including the Lambda binary's.
      - run: cargo clippy --all-targets --locked --all-features -- -D warnings
      - run: cargo test --locked --all-features

  # Dependency policy (deny.toml): advisories, licenses, banned crates and
  # sources. Linux only: the check covers every platform's dependencies.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A pinned release binary, checked against a checksum written here (not
      # downloaded next to it), rather than a third-party action or a
      # two-minute `cargo install`. Dependabot can't update this: change
      # VERSION and SHA256 together, from the release's .sha256 file.
      - name: Install cargo-deny
        env:
          VERSION: '0.22.0'
          SHA256: '98c56e6a408bfa5c3c60744b6015aaa6aa08f743fdeb88386d06fca035bb1786'
        run: |
          name="cargo-deny-${VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/${name}.tar.gz"
          echo "${SHA256}  cargo-deny.tar.gz" | sha256sum --check --strict
          tar -xzf cargo-deny.tar.gz
          install -m 0755 "${name}/cargo-deny" "${HOME}/.cargo/bin/cargo-deny"
          cargo deny --version
      - run: cargo deny --locked check

  # The AWS Lambda binary, built the way it will be deployed: for arm64
  # (Graviton) with cargo-lambda, which cross-compiles with Zig and links
  # against an old glibc so the binary runs on Lambda's provided.al2023.
  lambda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust (stable) with the arm64 target
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-unknown-linux-gnu
          rustup default stable
      # cargo-lambda and Zig from PyPI, into a fresh virtual environment, with
      # every file's SHA-256 checked against .github/requirements.
      - name: Install cargo-lambda
        run: |
          python3 -m venv "$RUNNER_TEMP/cargo-lambda"
          "$RUNNER_TEMP/cargo-lambda/bin/pip" install --require-hashes --only-binary=:all: \
            -r .github/requirements/cargo-lambda.txt
          echo "$RUNNER_TEMP/cargo-lambda/bin" >> "$GITHUB_PATH"
      - name: Build the Lambda binary (arm64)
        run: cargo lambda build --release --arm64 --locked --features lambda --bin lambda --output-format zip
      # Check the zip that would be deployed: its `bootstrap` must be an arm64
      # binary that Lambda's runtime can load.
      - name: Check the binary
        run: |
          unzip -o -q target/lambda/lambda/bootstrap.zip -d "$RUNNER_TEMP/lambda"
          bootstrap="$RUNNER_TEMP/lambda/bootstrap"
          file "$bootstrap" | tee /dev/stderr | grep -q 'ARM aarch64'
          # The newest glibc symbol version it needs. Lambda's provided.al2023
          # runtime has glibc 2.34, so nothing newer may appear.
          newest=$(readelf --dyn-syms --wide "$bootstrap" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "needs glibc $newest (provided.al2023 has 2.34)"
          [ "$(printf '%s\n2.34\n' "$newest" | sort -V | tail -1)" = "2.34" ]
          ls -l target/lambda/lambda/
      # The checked zip, kept for the deploy workflow (and for a week, in case
      # you want to look at it).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-bootstrap
          path: target/lambda/lambda/bootstrap.zip
          if-no-files-found: error
          retention-days: 7

  # template.yaml is valid SAM and passes cfn-lint. No AWS credentials needed.
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The native installer, at a pinned version, checked against the
      # release's published SHA-256.
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: 1.174.1
          use-installer: true
      - name: Validate template.yaml
        env:
          SAM_CLI_TELEMETRY: '0'
        run: sam validate --lint --region us-east-1
